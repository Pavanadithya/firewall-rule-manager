<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetShield SOC</title><style>body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#e7eef7}header{padding:20px 28px;background:#0c1a2c;border-bottom:1px solid #19304c}h1{margin:0;font-size:24px}main{padding:24px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0d1b2d;border:1px solid #19304c;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:700;margin-top:6px}.muted{color:#88a0bb}.toolbar{margin:18px 0;display:flex;gap:10px}button{background:#143252;border:1px solid #2a517b;color:#e7eef7;padding:9px 13px;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse;background:#0d1b2d;border:1px solid #19304c;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #19304c;font-size:13px}th{color:#8fa8c2}.status{padding:4px 8px;border-radius:20px;background:#142b45;color:#8fd0ff}.section{margin-top:22px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}th:nth-child(5),td:nth-child(5){display:none}}</style></head><body><header><h1>🛡️ NetShield SOC</h1><div class="muted">Enterprise Network Detection & Response Lab</div></header><main><div class="grid"><div class="card"><div class="muted">Events</div><div id="events" class="num">-</div></div><div class="card"><div class="muted">Alerts</div><div id="alerts" class="num">-</div></div><div class="card"><div class="muted">High Risk</div><div id="high" class="num">-</div></div><div class="card"><div class="muted">Critical</div><div id="critical" class="num">-</div></div></div><div class="toolbar"><button onclick="seed()">Run Attack Simulation</button><button onclick="load()">Refresh</button></div><div class="section"><h2>Incident Queue</h2><table><thead><tr><th>Risk</th><th>Detection</th><th>Source</th><th>Destination</th><th>MITRE</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function load(){let m=await(await fetch('/api/metrics')).json();events.textContent=m.events;alerts.textContent=m.alerts;high.textContent=m.high;critical.textContent=m.critical;let data=await(await fetch('/api/incidents')).json();rows.innerHTML=data.map(x=>`<tr><td><b>${x.risk}</b></td><td>${x.title}<br><span class="muted">${x.severity}</span></td><td>${x.src_ip||'-'}</td><td>${x.dst_ip||'-'}:${x.dst_port||'-'}</td><td>${x.mitre_id}</td><td><span class="status">${x.status}</span></td></tr>`).join('')||'<tr><td colspan="6">No incidents yet.</td></tr>'}async function seed(){await fetch('/api/demo/load',{method:'POST'});await load()}load();setInterval(load,5000)</script></body></html>
